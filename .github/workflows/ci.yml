name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----- Backend: lint + unit tests -------------------------------------------
  backend:
    name: Backend (Python 3.11 + Mongo)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: eaia_ci
      JWT_SECRET: ci-test-jwt-secret-do-not-use-in-prod
      SUPER_ADMIN_EMAIL: superadmin@ithr.tech
      SUPER_ADMIN_PASSWORD: preview-only-rotate-in-prod
      CORS_ORIGINS: "*"
      SENDER_EMAIL: no-reply@example.com
      # LLM / Stripe / Resend keys intentionally omitted — tests that need
      # them are skipped in CI. Add as GitHub secrets when the tests are
      # promoted to integration-test tier.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-xdist pytest-asyncio

      - name: Lint (ruff)
        working-directory: backend
        # Run ruff but don't fail the build on style-only warnings —
        # only hard errors (E, F) block CI.
        run: ruff check --select E,F --output-format=github .

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if nc -z localhost 27017; then echo "mongo up"; exit 0; fi
            sleep 1
          done
          echo "mongo failed to start"; exit 1

      - name: Run backend unit tests
        working-directory: backend
        # Skip external-service tests in CI (Stripe / Resend / OpenAI)
        # — those live in a separate integration-test tier.
        run: pytest tests/ -v --tb=short -m "not integration" -k "not stripe and not resend and not sora"

  # ----- Frontend: lint + production build ------------------------------------
  frontend:
    name: Frontend (Node 20 + Yarn)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    env:
      # Craco/CRA needs REACT_APP_BACKEND_URL at build time even though
      # the value is a placeholder in CI — it just gets baked into the bundle.
      REACT_APP_BACKEND_URL: https://ci-placeholder.example.com
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Lint (ESLint)
        # eslint config comes from craco/react-scripts. `yarn lint` isn't
        # defined so invoke ESLint directly on src/.
        run: |
          npx --yes eslint 'src/**/*.{js,jsx,ts,tsx}' --max-warnings=0 --format=stylish || \
          echo "eslint returned non-zero — see above; not blocking CI while lint config is stabilized"

      - name: Build production bundle
        run: yarn build

      - name: Report bundle size
        run: |
          du -sh build/ || true
          find build/static/js -name '*.js' -exec du -h {} + | sort -h | tail -10 || true

  # ----- Summary -------------------------------------------------------------
  ci-summary:
    name: CI summary
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "Backend result:  ${{ needs.backend.result }}"
          echo "Frontend result: ${{ needs.frontend.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed."
